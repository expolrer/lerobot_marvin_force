# 运行训练脚本时必须激活的 Conda 环境。
environment_name: lerobot_marvin_rdp

# 启动训练前验证的数据集契约。
dataset_contract:
  # LeRobot v3.0 数据集根目录。
  root: /home/marvin/hhw/peg_optical_module_0726force
  # RDP 必须存在的核心张量。
  features:
    # 当前 B 臂状态。
    observation.state:
      # 字段数据类型。
      dtype: float32
      # 七关节加夹爪的维度。
      shape: [8]
      # 状态通道的固定顺序。
      names: [joint_1.pos, joint_2.pos, joint_3.pos, joint_4.pos, joint_5.pos, joint_6.pos, joint_7.pos, gripper.pos]
    # SDK 估算关节外力。
    observation.joint_force:
      # 字段数据类型。
      dtype: float32
      # 单臂七关节力维度。
      shape: [7]
      # 力通道的固定顺序。
      names: [joint_1.force, joint_2.force, joint_3.force, joint_4.force, joint_5.force, joint_6.force, joint_7.force]
    # SDK 返回的 m_FB_Joint_SToq，可替代 joint_force 作为模型力条件。
    observation.joint_torque:
      # 字段数据类型。
      dtype: float32
      # 单臂七关节反馈扭矩维度。
      shape: [7]
      # 反馈扭矩通道的固定顺序。
      names: [joint_1.torque, joint_2.torque, joint_3.torque, joint_4.torque, joint_5.torque, joint_6.torque, joint_7.torque]
    # Policy 学习的绝对位置动作。
    action:
      # 字段数据类型。
      dtype: float32
      # 七关节加夹爪的动作维度。
      shape: [8]
      # 动作通道的固定顺序。
      names: [joint_1.pos, joint_2.pos, joint_3.pos, joint_4.pos, joint_5.pos, joint_6.pos, joint_7.pos, gripper.pos]

# RDP 必须依次完成 tokenizer 和 diffusion 两个阶段。
runs:
  # 第一阶段学习动作压缩器和逐时刻力条件解码器。
  - name: rdp_tokenizer_peg_0726
    # 每个键会转换成同名的 lerobot-train 命令行参数。
    args:
      # 数据集的逻辑仓库标识。
      dataset.repo_id: hukewei/peg_optical_module_0726force
      # 数据集的本地根目录。
      dataset.root: "${dataset_root}"
      # 留出百分之十的 episode 计算验证损失。
      dataset.eval_split: 0.1
      # 使用 Reactive Diffusion Policy。
      policy.type: rdp
      # 选择 tokenizer 训练阶段。
      policy.training_stage: tokenizer
      # 指定七维力条件字段。
      policy.force_feature_key: observation.joint_force
      # 使用 CUDA 训练。
      policy.device: cuda
      # 使用 bfloat16 自动混合精度。
      policy.dtype: bfloat16
      # 启用自动混合精度。
      policy.use_amp: true
      # 第一阶段模型仓库标识。
      policy.repo_id: hukewei/rdp_tokenizer_peg_optical_module_0726force
      # 默认不自动上传模型。
      policy.push_to_hub: false
      # 第一阶段输出目录。
      output_dir: "${repo_root}/outputs/train/rdp_tokenizer_peg_0726"
      # 第一阶段任务名称。
      job_name: rdp_tokenizer_peg_0726
      # 第一阶段 batch 大小。
      batch_size: 16
      # DataLoader 工作进程数量。
      num_workers: 4
      # 第一阶段优化步数。
      steps: 100000
      # checkpoint 保存间隔。
      save_freq: 10000
      # 验证损失计算间隔。
      eval_steps: 5000
      # 日志输出间隔。
      log_freq: 200
      # 随机种子。
      seed: 1000
      # 是否恢复第一阶段训练。
      resume: false
      # 是否记录到 Weights & Biases。
      wandb.enable: true
  # 第二阶段冻结 tokenizer 并训练低频视觉 latent diffusion。
  - name: rdp_diffusion_peg_0726
    # 每个键会转换成同名的 lerobot-train 命令行参数。
    args:
      # 数据集的逻辑仓库标识。
      dataset.repo_id: hukewei/peg_optical_module_0726force
      # 数据集的本地根目录。
      dataset.root: "${dataset_root}"
      # 留出百分之十的 episode 计算验证损失。
      dataset.eval_split: 0.1
      # 从第一阶段完整 checkpoint 载入 tokenizer。
      policy.path: "${repo_root}/outputs/train/rdp_tokenizer_peg_0726/checkpoints/last/pretrained_model"
      # 切换到 diffusion 训练阶段。
      policy.training_stage: diffusion
      # 使用 CUDA 训练。
      policy.device: cuda
      # 使用 bfloat16 自动混合精度。
      policy.dtype: bfloat16
      # 启用自动混合精度。
      policy.use_amp: true
      # 第二阶段模型仓库标识。
      policy.repo_id: hukewei/rdp_peg_optical_module_0726force
      # 默认不自动上传模型。
      policy.push_to_hub: false
      # 第二阶段输出目录。
      output_dir: "${repo_root}/outputs/train/rdp_diffusion_peg_0726"
      # 第二阶段任务名称。
      job_name: rdp_diffusion_peg_0726
      # 第二阶段 batch 大小。
      batch_size: 4
      # DataLoader 工作进程数量。
      num_workers: 4
      # 第二阶段优化步数。
      steps: 200000
      # checkpoint 保存间隔。
      save_freq: 10000
      # 验证损失计算间隔。
      eval_steps: 5000
      # 日志输出间隔。
      log_freq: 200
      # 随机种子。
      seed: 1000
      # 是否恢复第二阶段训练。
      resume: false
      # 是否记录到 Weights & Biases。
      wandb.enable: true
