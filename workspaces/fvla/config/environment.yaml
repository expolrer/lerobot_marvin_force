# 当前工作区对应的模型短名称。
model_name: forcevla

# 当前 Git 分支名称，用于确定环境命名。
branch_name: forcevla

# Conda 创建和运行的环境名称。
environment_name: lerobot_marvin_forcevla

# LeRobot 0.6.1 要求的 Python 主次版本。
python_version: "3.12"

# ForceVLA 额外安装 PI0 所需的 Transformers 与 SciPy 依赖。
editable_extras: "[training,hardware,matplotlib-dep,pi]"
